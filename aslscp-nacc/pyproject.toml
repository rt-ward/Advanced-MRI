[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aslscp-nacc"
version = "0.1.0"
description = "Flywheel gear wrapper for the ASLscp pipeline"
requires-python = ">=3.9"
dependencies = [
    "fw-gear[sdk]~=0.3.0",
]

[tool.setuptools]
py-modules = []

[tool.ruff.lint]
select = ["A", "B", "E", "W", "F", "I", "RUF", "SIM", "C90", "PLW0406", "COM818", "SLF001"]
